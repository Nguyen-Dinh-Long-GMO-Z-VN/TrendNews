app:
  version_check_url: "https://raw.githubusercontent.com/sansan0/TrendRadar/refs/heads/master/version"
  show_version_update: true # 控制显示版本更新提示，如果 false，则不接受新版本提示

crawler:
  request_interval: 1000 # 请求间隔(毫秒)
  enable_crawler: true # 是否启用爬取新闻功能，如果 false，则直接停止程序
  use_proxy: false # 是否启用代理，false 时为关闭
  default_proxy: "http://127.0.0.1:10086"
  rss_max_items: 50

# `report.mode` xác định cách tổng hợp nội dung, không đặt lịch chạy.
# Lịch do môi trường triển khai điều khiển: GitHub Actions hoặc CRON_SCHEDULE trong Docker.
# daily: tổng hợp tin khớp trong ngày.
# current: báo cáo theo bảng xếp hạng mới nhất.
# incremental: ưu tiên các tin mới xuất hiện từ lần thu thập trước.
#   • 适用场景：避免重复信息干扰

# 推送模式选择
report:
  mode: "daily" # 可选: "daily"|"incremental"|"current"
  rank_threshold: 5 # 排名高亮阈值

notification:
  enable_notification: false # 是否启用通知功能，如果 false，则不发送手机通知
  message_batch_size: 4000 # 消息分批大小（字节）(这个配置别动)
  batch_send_interval: 3 # 批次发送间隔（秒）

  # 🕐 推送时间窗口控制（可选功能）
  # 用途：限制推送的时间范围，避免非工作时间打扰
  # 适用场景：
  #   - 只想在工作日白天接收推送（如 09:00-18:00）
  #   - 希望在晚上固定时间收到汇总（如 20:00-22:00）
  push_window:
    enabled: false  # 是否启用推送时间窗口控制，默认关闭
    # 注意：GitHub Actions 执行时间不稳定，时间范围建议至少留足 2 小时
    # 如果想要精准的定时推送，建议使用 Docker 部署在个人服务器上
    time_range:
      start: "20:00"  # 推送时间窗口开始（北京时间）
      end: "22:00"    # 推送时间窗口结束（北京时间）
    once_per_day: true  # 每天在时间窗口内只推送一次，如果 false，则窗口内每次执行都推送
    push_record_retention_days: 7  # 推送记录保留天数

  # ⚠️⚠️⚠️ 重要安全警告 / IMPORTANT SECURITY WARNING ⚠️⚠️⚠️
  #
  # 🔴 请务必妥善保管好 webhooks，不要公开!!!
  # 🔴 如果你以 fork 的方式将本项目部署在 GitHub 上，请勿在下面填写任何 webhooks
  # 🔴 而是将 webhooks 填入 GitHub Secret（Settings → Secrets and variables → Actions）
  # 🔴 否则：
  #    - 轻则：手机上收到大量垃圾广告推送
  #    - 重则：webhook 被滥用造成严重安全隐患（如恶意消息轰炸、钓鱼链接等）
  #
  # 🔴 NEVER expose webhooks publicly!!!
  # 🔴 If deploying via GitHub fork, DO NOT fill webhooks below
  # 🔴 Instead, add them to GitHub Secrets (Settings → Secrets and variables → Actions)
  # 🔴 Consequences of exposure:
  #    - Minor: Spam notifications flooding your devices
  #    - Severe: Webhook abuse leading to security incidents (malicious messages, phishing links, etc.)
  #
  webhooks:
    telegram_bot_token: "" # Telegram Bot Token
    telegram_chat_id: "" # Telegram Chat ID
    email_from: "" # 发件人邮箱地址
    email_password: "" # 发件人邮箱密码或授权码
    email_to: "" # 收件人邮箱地址，多个收件人用逗号分隔
    email_smtp_server: "" # SMTP服务器地址（可选，留空自动识别）
    email_smtp_port: "" # SMTP端口（可选，留空自动识别）

# 用于让关注度更高的新闻在更前面显示，即用算法重新组合不同平台的热搜排序形成你侧重的热搜，合起来是 1 就行
weight:
  rank_weight: 0.6 # 排名权重
  frequency_weight: 0.3 # 频次权重
  hotness_weight: 0.1 # 热度权重

investment_analysis:
  enabled: true
  min_news_threshold: 3  # số tin tức tối thiểu để kích hoạt phân tích một nhóm tài sản
  cache_hours: 6         # thời gian cache kết quả phân tích (giờ)

# Dịch tiêu đề sang tiếng Việt bằng AI (mặc định Gemini, cấu hình qua TRANSLATE_* env)
translation:
  enabled: false         # bật để dịch tất cả tin crawl sang tiếng Việt
  language: Vietnamese
  batch_size: 50         # số title mỗi request
  batch_delay: 2.0       # giãn cách giữa các batch (giây) — free tier Gemini ~15 RPM
  max_retries: 2
  cache_file: data/translation_cache.json

# Gộp tin trùng xuyên nguồn (cùng sự kiện trên nhiều platform)
dedup:
  enabled: true
  similarity_threshold: 0.88   # 0.85–0.92 hợp lý; cao hơn = bảo thủ hơn

# Lọc tin theo mô tả sở thích tự nhiên (config/ai_interests.txt)
ai_filter:
  enabled: false
  mode: prefilter        # prefilter: lọc trước rồi keyword groups tổ chức report
                         # replace: AI thay hẳn keyword groups
  interests_file: config/ai_interests.txt
  batch_size: 30
  batch_delay: 4.0       # free tier Gemini ~15 RPM — delay thấp sẽ dính 429
  max_retries: 2
  min_score: 0.5
  criteria_cache_file: data/ai_criteria_cache.json
  debug: false

